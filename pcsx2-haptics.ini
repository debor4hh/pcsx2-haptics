; PCSX2 Haptics - settings.
; Most of these can be changed live from the tray icon (left click = settings window,
; right click = quick menu); the tray saves them back here.

[Intiface]
; Buttplug server address. If nothing answers here, intiface-engine.exe is started
; in the background (hidden) and closed again when PCSX2 exits.
Host=127.0.0.1
Port=12345
AutoStartServer=1
; Relative to the PCSX2 folder, or a full path.
ServerPath=intiface-engine.exe
; Extra engine arguments, e.g. --use-lovense-dongle-hid for the Lovense USB dongle.
ServerArgs=

[Haptics]
Enabled=1
; XInput controller to follow: 0 = XInput-0 (Pad 1), 1..3 = others, -1 = any.
Controller=0
; How the two controller motors become one vibration level:
;   max   = the stronger of the two (default)
;   mix   = both added together
;   large = large (left) motor only
;   small = small (right) motor only
Mode=max
; Weight of each motor before combining (0.0 - 1.0+).
; On a DualShock 2 the small motor is on/off only, so it is toned down by default.
LargeMotorWeight=1.0
SmallMotorWeight=0.6
; Overall multiplier, and the minimum level whenever there is any rumble.
Scale=1.0
MinIntensity=0.0
; How often the toy is updated, in milliseconds (minimum 20).
UpdateIntervalMs=60

[Controller]
; 1 = the gamepad keeps vibrating as usual, 0 = only the toy vibrates.
ForwardRumble=1

[Notifications]
; Windows notification when a toy connects or disconnects.
Enabled=1

[Debug]
; Writes pcsx2-haptics.log next to this file.
Log=1
; Also log every rumble change and server message (verbose).
LogRumble=0

; Per-toy vibrator mapping is saved automatically from the settings window, e.g.:
; [Toy: Lovense Edge]
; Vibrator1=large
; Vibrator2=small
; Values: large, small, both (combined using Mode), off.
